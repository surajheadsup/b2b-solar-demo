.trust-chip { display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); font-size:12px; font-weight:650; }
.trust-chip svg { width:15px; height:15px; flex:none; }
.trust-chip.gold { background:rgba(247,168,27,.16); border-color:rgba(247,168,27,.34); color:var(--accent-soft); }
.theme-toggle { width:40px; height:40px; min-width:40px; display:grid; place-items:center; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:var(--on-hero); cursor:pointer; --od-icon-size:19px; }
.theme-toggle:hover { background:rgba(255,255,255,.18); }
.hs-appbar .theme-toggle { border-color:var(--border); background:var(--surface); color:var(--text); }
.hs-appbar .theme-toggle:hover { background:var(--surface-2); }

.login-sheet { position:relative; z-index:2; margin:-22px 16px 0; background:var(--surface); border:1px solid var(--border); border-radius:26px; padding:22px 18px; box-shadow:var(--shadow); }
.field-label { font-size:13px; font-weight:700; color:var(--text); display:block; margin-bottom:9px; }
.field-label .hindi { color:var(--muted); font-weight:600; }
.lang-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.lang-card { position:relative; display:flex; flex-direction:column; gap:3px; align-items:flex-start; padding:13px 14px; border-radius:16px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; font:inherit; text-align:left; min-height:72px; }
.lang-card .script { font-size:22px; font-weight:700; line-height:1; }
.lang-card .name { font-size:12.5px; color:var(--muted); font-weight:600; }
.lang-card.is-on { border-color:var(--primary); background:var(--primary-tint); box-shadow:0 0 0 1px var(--primary); }
.lang-card.is-on .name { color:var(--primary); }
.lang-card .tick { position:absolute; top:10px; right:10px; width:20px; height:20px; border-radius:50%; background:var(--primary); color:var(--on-primary); display:none; place-items:center; }
.lang-card .tick svg { width:13px; height:13px; }
.lang-card.is-on .tick { display:grid; }
.phone-grp { display:flex; gap:9px; }
.phone-cc { min-width:62px; display:inline-flex; align-items:center; justify-content:center; border-radius:14px; border:1.5px solid var(--border); background:var(--surface-2); font-weight:700; font-size:14.5px; }
.hs-input { width:100%; min-height:52px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); padding:0 15px; font:inherit; font-size:16px; }
.hs-input::placeholder { color:var(--muted); }
.hs-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint); }
.consent { display:flex; align-items:center; gap:11px; margin-top:16px; padding:12px 13px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border); cursor:pointer; }
.consent input { position:absolute; opacity:0; width:0; height:0; }
.consent .box { width:24px; height:24px; min-width:24px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); display:grid; place-items:center; color:transparent; }
.consent .box svg { width:15px; height:15px; }
.consent input:checked + .box { background:var(--success); border-color:var(--success); color:#fff; }
.consent .wa { width:30px; height:30px; min-width:30px; border-radius:9px; background:var(--success-tint); color:var(--success); display:grid; place-items:center; }
.consent .wa svg { width:17px; height:17px; }
.consent .txt { font-size:13px; font-weight:600; line-height:1.4; }
.secure { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:14px; color:var(--muted); font-size:12px; font-weight:600; }
.secure svg { width:14px; height:14px; }
.login-foot { padding:20px 20px 10px; }
.returning { display:flex; align-items:center; gap:11px; padding:13px 14px; border-radius:16px; background:var(--surface-2); border:1px dashed var(--border); }
.returning .ic { width:34px; height:34px; min-width:34px; border-radius:10px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; }
.returning .ic svg { width:18px; height:18px; }
.returning .t { font-size:12.5px; font-weight:650; }
.returning .d { font-size:11.5px; color:var(--muted); line-height:1.4; }
.terms { text-align:center; font-size:11.5px; color:var(--muted); margin:16px 0 0; line-height:1.5; }
.terms a { color:var(--primary); text-decoration:none; font-weight:650; }

/* ===================== Flow pages (bill / estimate / dashboard home) ===================== */
.hs-backbtn { width:42px; height:42px; min-width:42px; display:grid; place-items:center; border-radius:12px; border:none; background:transparent; color:var(--text); cursor:pointer; --od-icon-size:22px; text-decoration:none; }
.hs-backbtn:hover { background:var(--surface-2); }
.hs-stepchip { display:inline-flex; align-items:center; min-height:30px; padding:0 11px; border-radius:999px; background:var(--primary-tint); color:var(--primary); font-weight:700; font-size:12.5px; }
.hs-steptrack { height:6px; border-radius:999px; background:var(--primary-tint); overflow:hidden; }
.hs-steptrack > i { display:block; height:100%; background:var(--primary); border-radius:999px; transition:width .3s ease; }

.hs-opt { display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px; color:var(--text); cursor:pointer; font:inherit; text-decoration:none; }
.hs-opt:hover { background:var(--surface-2); }
.hs-opt.is-on { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); background:var(--surface-2); }
.hs-opt .lead { width:42px; height:42px; min-width:42px; border-radius:12px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; --od-icon-size:21px; }

.hs-chip { display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:650; font-size:14px; cursor:pointer; }
.hs-chip.is-on { background:var(--primary-tint); border-color:var(--primary); color:var(--text); }
.hs-pill.accent { background:color-mix(in srgb,var(--accent) 20%, var(--surface)); color:var(--accent-ink); }
.phone-frame[data-theme="dark"] .hs-pill.accent { color:var(--accent); }

.hs-cmp { width:100%; border-collapse:collapse; font-size:13.5px; }
.hs-cmp th, .hs-cmp td { padding:10px 8px; border-bottom:1px solid var(--border); text-align:center; }
.hs-cmp th:first-child, .hs-cmp td:first-child { text-align:left; color:var(--muted); font-weight:600; }
.hs-cmp thead th { font-size:12.5px; font-weight:700; }
.hs-cmp .yes { color:var(--success); } .hs-cmp .no { color:var(--error); }
.hs-cmp .od-icon { --od-icon-size:17px; }

.hs-priceline { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
.hs-priceline.total { font-weight:750; border-bottom:none; font-size:15px; padding-top:12px; }
.hs-priceline.sub { color:var(--success); font-weight:650; }
.hs-priceline .amt { font-weight:700; white-space:nowrap; }

/* Dashboard (variant D) home */
.dash-top { background:var(--hero); color:var(--on-hero); padding:12px 18px 54px; border-radius:0 0 26px 26px; }
.dash-top .dim { color:var(--on-hero-dim); }
.dash-strip { display:flex; align-items:center; gap:12px; margin-top:16px; }
.dash-strip .amt { font-size:26px; font-weight:800; color:var(--accent); letter-spacing:-.01em; }
.dash-actions { margin:-38px 14px 0; position:relative; z-index:2; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:14px 8px; box-shadow:var(--shadow); display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
.dash-act { display:flex; flex-direction:column; align-items:center; gap:7px; padding:8px 4px; background:none; border:none; cursor:pointer; font:inherit; color:var(--text); text-decoration:none; }
.dash-act .ico { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; --od-icon-size:21px; }
.dash-act .ico.p { background:var(--primary-tint); color:var(--primary); }
.dash-act .ico.g { background:color-mix(in srgb,var(--accent) 20%, var(--surface)); color:var(--accent-ink); }
.phone-frame[data-theme="dark"] .dash-act .ico.g { color:var(--accent); }
.dash-act .lbl { font-size:11.5px; font-weight:650; }
.dash-act:hover .ico { filter:brightness(.97); }

/* ===================== Estimate: compact-dense shell + accordions + animated bg ===================== */
.est-app { position:relative; height:100%; display:flex; flex-direction:column; background:var(--bg); color:var(--text); overflow:hidden; }
.est-head { position:relative; z-index:2; flex:none; display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--bg); }
.est-head .title { font-size:18px; font-weight:750; }
.est-scroll { position:relative; z-index:1; flex:1; overflow-y:auto; min-height:0; scrollbar-width:none; }
.est-scroll::-webkit-scrollbar { display:none; }
.est-pad { padding:14px 16px 18px; display:flex; flex-direction:column; gap:12px; }
.est-price { font-size:27px; font-weight:800; color:var(--accent); letter-spacing:-.02em; line-height:1; }
.est-mini { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.est-mini .hs-stat { padding:9px; text-align:center; }
.est-mini .hs-stat .k { justify-content:center; }
.est-mini .hs-stat .v { font-size:15px; }
.est-bar { position:relative; z-index:2; flex:none; background:var(--surface); border-top:1px solid var(--border); padding:11px 14px calc(11px + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 24px -16px rgba(0,0,0,.4); display:flex; flex-direction:column; gap:9px; }
.est-bar .row { display:flex; gap:9px; align-items:stretch; }
.act { flex:1; min-height:48px; border-radius:13px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; --od-icon-size:19px; font:inherit; font-size:10.5px; font-weight:700; cursor:pointer; text-decoration:none; }
.act:hover { background:var(--bg-subtle); }
.v-dense { font-size:14px; }
.v-dense .est-pad { gap:9px; }
.v-dense .hs-sec-title { font-size:15px; }

.acc { border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden; }
.acc-h { width:100%; display:flex; align-items:center; gap:10px; padding:14px; background:none; border:none; font:inherit; font-weight:700; font-size:14.5px; color:var(--text); cursor:pointer; min-height:52px; }
.acc-h .ttl { flex:1; text-align:left; }
.acc-h .sumv { font-size:12.5px; color:var(--muted); font-weight:650; }
.acc-h .chev { --od-icon-size:18px; color:var(--muted); transition:transform .2s ease; display:inline-grid; }
.acc-h[aria-expanded="true"] .chev { transform:rotate(90deg); }
.acc-body { padding:0 14px 14px; }

/* Subtle animated ambient — drifting brand-coloured blobs behind the content */
.est-ambient { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.est-ambient .blob { position:absolute; border-radius:50%; filter:blur(36px); will-change:transform; }
.est-ambient .b1 { width:220px; height:220px; top:-50px; left:-60px; background:radial-gradient(circle, color-mix(in srgb,var(--primary) 34%, transparent), transparent 70%); animation:floatA 17s ease-in-out infinite; }
.est-ambient .b2 { width:240px; height:240px; bottom:120px; right:-70px; background:radial-gradient(circle, color-mix(in srgb,var(--accent) 22%, transparent), transparent 70%); animation:floatB 23s ease-in-out infinite; }
.est-ambient .b3 { width:180px; height:180px; top:44%; left:28%; background:radial-gradient(circle, color-mix(in srgb,var(--primary) 18%, transparent), transparent 70%); animation:floatA 29s ease-in-out infinite reverse; }
@keyframes floatA { 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(26px,22px); } }
@keyframes floatB { 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-30px,-18px); } }

/* Animated glow inside the summary hero */
.est-hero { position:relative; overflow:hidden; background:var(--hero); color:var(--on-hero); border-radius:18px; padding:16px; }
.est-hero > * { position:relative; z-index:1; }
.est-hero .hero-anim { position:absolute; inset:0; z-index:0; pointer-events:none; }
.est-hero .hero-anim .pulse { position:absolute; top:-52px; right:-34px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(247,168,27,.5), transparent 62%); animation:glowPulse 6s ease-in-out infinite; }
.est-hero .hero-anim .ray { position:absolute; top:-66px; right:-48px; width:210px; height:210px; opacity:.16; transform-origin:50% 50%; animation:spinSlow 36s linear infinite; }
.est-hero .hero-anim .ray line { stroke:var(--accent-soft); stroke-width:3; stroke-linecap:round; }
@keyframes glowPulse { 0%,100%{ opacity:.4; transform:scale(1); } 50%{ opacity:.72; transform:scale(1.08); } }
@keyframes spinSlow { to { transform:rotate(360deg); } }

/* ===================== Plan step pages (shared gradient background + pickers) ===================== */
.step-app { min-height:100%; display:flex; flex-direction:column; color:var(--text);
  background:linear-gradient(180deg, color-mix(in srgb, var(--primary) 16%, var(--bg)) 0%, color-mix(in srgb, var(--accent) 6%, var(--bg)) 34%, var(--bg) 70%); }
/* Solid, opaque sticky header + progress so scrolling content never bleeds through */
.step-app .hs-appbar { background:color-mix(in srgb, var(--primary) 16%, var(--bg)); }
.step-app .step-bar { background:transparent; }
.step-bar { padding:12px 16px 0; }
.step-title { font-size:20px; font-weight:750; letter-spacing:-.01em; margin:0; }
.pick { display:flex; flex-wrap:wrap; gap:8px; }
.map { height:120px; border-radius:16px; border:1.5px dashed var(--border); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted); }
.map svg { width:26px; height:26px; }
.cta { padding:16px; }

/* Entrance (reduced-motion safe) */
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.anim-rise { animation: rise .5s ease both; }
.anim-rise.d1 { animation-delay:.06s; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

    share:'<path d="M12 15V4m0 0 3 3m-3-3L9 7"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    back:'<path d="m14 6-6 6 6 6"/>',
    doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/>',

    plan:'<rect x="5" y="6" width="14" height="15" rx="2"/><path d="M9 6V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1M8 11h8M8 15h5"/>',
    copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
    users:'<path d="M16 19a4 4 0 0 0-8 0"/><circle cx="12" cy="9" r="3"/><path d="M5 18a3.5 3.5 0 0 1 4-3M19 18a3.5 3.5 0 0 0-4-3"/>'
  };

  function iconSVG(name){
    return '<svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  function replaceIcons(root){
    var marks = root.querySelectorAll('[data-ic]');
    for (var i = 0; i < marks.length; i++){
      var el = marks[i];
      var wrap = document.createElement('span');
      wrap.innerHTML = iconSVG(el.getAttribute('data-ic'));
      var svg = wrap.firstChild;
      var extra = el.className.replace(/\bic\b/, '').trim();
      if (extra) svg.setAttribute('class', svg.getAttribute('class') + ' ' + extra);
      if (el.getAttribute('style')) svg.setAttribute('style', el.getAttribute('style'));
      el.parentNode.replaceChild(svg, el);
    }
  }

  function setThemeIcon(btn, theme){
    btn.innerHTML = iconSVG(theme === 'dark' ? 'sun' : 'moon');
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }

  function initTheme(){
    var frame = document.querySelector('.phone-frame');
    if (!frame) return;
    if (!frame.getAttribute('data-theme')){
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      frame.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    }
    var toggles = document.querySelectorAll('[data-theme-toggle]');
    for (var i = 0; i < toggles.length; i++) setThemeIcon(toggles[i], frame.getAttribute('data-theme'));
  }

  document.addEventListener('DOMContentLoaded', function () {
    replaceIcons(document);
    initTheme();

    document.addEventListener('click', function (e){
      var t = e.target;
      if (!t.closest) return;

      // Accordion
      var acc = t.closest('.acc-h');
      if (acc){
        var accOpen = acc.getAttribute('aria-expanded') === 'true';
        acc.setAttribute('aria-expanded', String(!accOpen));
        var accBody = acc.parentNode.querySelector('.acc-body');
        if (accBody) accBody.hidden = accOpen;
        return;
      }

      // Single-select chip group (plan steps)
      var pchip = t.closest('.pick[data-group] .hs-chip');
      if (pchip){
        var pgrp = pchip.closest('.pick');
        var pchips = pgrp.querySelectorAll('.hs-chip');
        for (var pi = 0; pi < pchips.length; pi++) pchips[pi].classList.remove('is-on');
        pchip.classList.add('is-on');
        return;
      }

      // Copy to clipboard (referral code, etc.)
      var cp = t.closest('[data-copy]');
      if (cp){
        var val = cp.getAttribute('data-copy');
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val); } catch (err) {}
        var lbl = cp.querySelector('[data-copy-label]');
        if (lbl){
          if (!lbl.getAttribute('data-prev')) lbl.setAttribute('data-prev', lbl.textContent);
          lbl.textContent = 'Copied ✓';
          setTimeout(function (){ lbl.textContent = lbl.getAttribute('data-prev'); }, 1600);
        }
        return;
      }

      // Theme toggle
      var themeBtn = t.closest('[data-theme-toggle]');
      if (themeBtn){
        var frame = document.querySelector('.phone-frame');
        var next = frame.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        frame.setAttribute('data-theme', next);
        var toggles = document.querySelectorAll('[data-theme-toggle]');
        for (var i = 0; i < toggles.length; i++) setThemeIcon(toggles[i], next);
        return;
      }

      // Language cards (login)
      var card = t.closest('.lang-card');
      if (card){
        var grid = card.closest('.lang-grid');
        if (grid){
          var cards = grid.querySelectorAll('.lang-card');
          for (var c = 0; c < cards.length; c++){ cards[c].classList.remove('is-on'); cards[c].removeAttribute('aria-pressed'); }
          card.classList.add('is-on'); card.setAttribute('aria-pressed','true');
        }
        return;
      }

      // Language toggle (home app bar) — swaps the hero headline EN/HI
      var lang = t.closest('[data-lang]');
      if (lang){
        var grp = lang.closest('.hs-langtoggle');
        if (grp){
          var ls = grp.querySelectorAll('[data-lang]');
          for (var l = 0; l < ls.length; l++) ls[l].classList.remove('is-on');
          lang.classList.add('is-on');
        }
        var code = lang.getAttribute('data-lang');
        var title = document.querySelector('[data-en][data-hi]');
        if (title){
          var next2 = title.getAttribute(code === 'hi' ? 'data-hi' : 'data-en');
          if (next2){ title.textContent = next2; title.setAttribute('lang', code === 'hi' ? 'hi' : 'en'); }
        }
        return;
      }

      // Hero bill chips (single select)
      var hchip = t.closest('.hs-hchip');
      if (hchip){
        var row = hchip.parentNode;
        var sibs = row.querySelectorAll('.hs-hchip');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('is-on');
        hchip.classList.add('is-on');
      }
    });
  });
})();

  isolation: isolate;

.hs-hchip.is-on { background:#fff; color:var(--hero); }

/* Stats */
.hs-stat { padding:13px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border); }
.hs-stat .k { font-size:12px; color:var(--muted); font-weight:600; display:inline-flex; align-items:center; gap:6px; --od-icon-size:15px; }

.hs-stat .v small { font-size:12px; font-weight:600; color:var(--muted); }

/* Language toggle (home app bar) */
.hs-langtoggle { display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
.hs-lang-opt { min-width:40px; min-height:36px; padding:0 11px; border:none; background:transparent; color:var(--muted); font:inherit; font-weight:700; font-size:13px; border-radius:999px; cursor:pointer; }
.hs-lang-opt.is-on { background:var(--primary); color:var(--on-primary); }

/* Alert (cream) */
.hs-alert { background:color-mix(in srgb, var(--accent) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--accent) 34%, transparent); border-radius:16px; padding:15px; }
.hs-alert .hd { display:flex; align-items:center; gap:8px; color:var(--accent-ink); font-weight:750; font-size:13px; --od-icon-size:18px; }
.phone-frame[data-theme="dark"] .hs-alert .hd { color:var(--accent); }

/* Timeline */
.hs-timeline { list-style:none; margin:0; padding:0; }
.hs-timeline li { position:relative; display:grid; grid-template-columns:28px 1fr; gap:12px; padding-bottom:16px; }
.hs-timeline li:last-child { padding-bottom:0; }
.hs-dot { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; --od-icon-size:15px; z-index:1; }
.hs-dot.done { background:var(--success); color:#fff; }
.hs-dot.todo { background:var(--surface); border:1.5px solid var(--border); color:var(--muted); }
.hs-timeline li:not(:last-child) .hs-dot::after { content:""; position:absolute; top:28px; left:12px; bottom:2px; width:2px; background:var(--border); }
.hs-tl-title { font-weight:650; font-size:14px; }
.hs-tl-meta { font-size:12.5px; color:var(--muted); }

/* Video row */
.hs-video { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:11px; color:var(--text); cursor:pointer; font:inherit; text-decoration:none; }
.hs-video:hover { background:var(--surface-2); }
.hs-video .play { width:44px; height:44px; min-width:44px; border-radius:11px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; --od-icon-size:18px; }

/* Avatar */
.hs-avatar { width:52px; height:52px; min-width:52px; border-radius:50%; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; font-weight:750; font-size:20px; }
.hs-avatar.sm { width:38px; height:38px; min-width:38px; font-size:14px; --od-icon-size:18px; }
.hs-avatar.gold { background:var(--accent); color:var(--accent-ink); }

/* Bottom nav */
.hs-nav { position:sticky; bottom:0; z-index:6; display:flex; background:var(--surface); border-top:1px solid var(--border); padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px)); }
.hs-nav-item { flex:1; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; min-height:50px; color:var(--muted); font:inherit; --od-icon-size:23px; border-radius:12px; text-decoration:none; }
.hs-nav-item .lbl { font-size:11px; font-weight:650; }
.hs-nav-item[aria-current="page"] { color:var(--primary); }
.hs-nav-item:hover { background:var(--surface-2); }

/* ===================== Login page ===================== */
.login-hero {
  position:relative; overflow:hidden; color:var(--on-hero);
  background:
    radial-gradient(130% 90% at 82% -4%, var(--hero-2) 0%, transparent 52%),
    radial-gradient(120% 80% at 8% 2%, rgba(247,168,27,.16) 0%, transparent 46%),
    var(--hero);
  padding: 2px 22px 50px; border-radius:0 0 34px 34px;
}
.login-sun { position:absolute; top:-26px; right:-26px; width:188px; height:188px; opacity:.5; pointer-events:none; }
.login-hero-inner { position:relative; z-index:1; }
.login-topbar { display:flex; align-items:center; justify-content:flex-end; padding-top:6px; }
.brand-lockup { display:flex; align-items:center; gap:12px; margin-top:4px; }
.brand-mark { width:46px; height:46px; min-width:46px; border-radius:14px; display:grid; place-items:center; color:var(--accent-ink); background:linear-gradient(150deg, var(--accent-soft), var(--accent)); box-shadow:0 8px 20px -8px rgba(247,168,27,.7); }
.brand-mark svg { width:26px; height:26px; }
.brand-name { font-size:17px; font-weight:800; letter-spacing:.01em; line-height:1; display:block; }
.brand-tag { font-size:11px; font-weight:650; letter-spacing:.22em; text-transform:uppercase; color:var(--on-hero-dim); margin-top:5px; }
.hero-headline { font-size:27px; font-weight:750; letter-spacing:-.01em; line-height:1.22; margin:24px 0 0; }
.hero-sub { color:var(--on-hero-dim); font-size:14px; line-height:1.55; margin:12px 0 0; max-width:300px; }
.trust-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
.trust-chip { display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); font-size:12px; font-weight:650; }
.trust-chip svg { width:15px; height:15px; flex:none; }
.trust-chip.gold { background:rgba(247,168,27,.16); border-color:rgba(247,168,27,.34); color:var(--accent-soft); }
.theme-toggle { width:40px; height:40px; min-width:40px; display:grid; place-items:center; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:var(--on-hero); cursor:pointer; --od-icon-size:19px; }
.theme-toggle:hover { background:rgba(255,255,255,.18); }
.hs-appbar .theme-toggle { border-color:var(--border); background:var(--surface); color:var(--text); }
.hs-appbar .theme-toggle:hover { background:var(--surface-2); }

.login-sheet { position:relative; z-index:2; margin:-22px 16px 0; background:var(--surface); border:1px solid var(--border); border-radius:26px; padding:22px 18px; box-shadow:var(--shadow); }
.field-label { font-size:13px; font-weight:700; color:var(--text); display:block; margin-bottom:9px; }
.field-label .hindi { color:var(--muted); font-weight:600; }
.lang-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.lang-card { position:relative; display:flex; flex-direction:column; gap:3px; align-items:flex-start; padding:13px 14px; border-radius:16px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; font:inherit; text-align:left; min-height:72px; }
.lang-card .script { font-size:22px; font-weight:700; line-height:1; }
.lang-card .name { font-size:12.5px; color:var(--muted); font-weight:600; }
.lang-card.is-on { border-color:var(--primary); background:var(--primary-tint); box-shadow:0 0 0 1px var(--primary); }
.lang-card.is-on .name { color:var(--primary); }
.lang-card .tick { position:absolute; top:10px; right:10px; width:20px; height:20px; border-radius:50%; background:var(--primary); color:var(--on-primary); display:none; place-items:center; }
.lang-card .tick svg { width:13px; height:13px; }
.lang-card.is-on .tick { display:grid; }
.phone-grp { display:flex; gap:9px; }
.phone-cc { min-width:62px; display:inline-flex; align-items:center; justify-content:center; border-radius:14px; border:1.5px solid var(--border); background:var(--surface-2); font-weight:700; font-size:14.5px; }
.hs-input { width:100%; min-height:52px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); padding:0 15px; font:inherit; font-size:16px; }
.hs-input::placeholder { color:var(--muted); }
.hs-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint); }
.consent { display:flex; align-items:center; gap:11px; margin-top:16px; padding:12px 13px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border); cursor:pointer; }
.consent input { position:absolute; opacity:0; width:0; height:0; }
.consent .box { width:24px; height:24px; min-width:24px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); display:grid; place-items:center; color:transparent; }
.consent .box svg { width:15px; height:15px; }
.consent input:checked + .box { background:var(--success); border-color:var(--success); color:#fff; }
.consent .wa { width:30px; height:30px; min-width:30px; border-radius:9px; background:var(--success-tint); color:var(--success); display:grid; place-items:center; }
.consent .wa svg { width:17px; height:17px; }
.consent .txt { font-size:13px; font-weight:600; line-height:1.4; }
.secure { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:14px; color:var(--muted); font-size:12px; font-weight:600; }
.secure svg { width:14px; height:14px; }
.login-foot { padding:20px 20px 10px; }
.returning { display:flex; align-items:center; gap:11px; padding:13px 14px; border-radius:16px; background:var(--surface-2); border:1px dashed var(--border); }
.returning .ic { width:34px; height:34px; min-width:34px; border-radius:10px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; }
.returning .ic svg { width:18px; height:18px; }
.returning .t { font-size:12.5px; font-weight:650; }
.returning .d { font-size:11.5px; color:var(--muted); line-height:1.4; }
.terms { text-align:center; font-size:11.5px; color:var(--muted); margin:16px 0 0; line-height:1.5; }
.terms a { color:var(--primary); text-decoration:none; font-weight:650; }

/* ===================== Flow pages (bill / estimate / dashboard home) ===================== */
.hs-backbtn { width:42px; height:42px; min-width:42px; display:grid; place-items:center; border-radius:12px; border:none; background:transparent; color:var(--text); cursor:pointer; --od-icon-size:22px; text-decoration:none; }
.hs-backbtn:hover { background:var(--surface-2); }
.hs-stepchip { display:inline-flex; align-items:center; min-height:30px; padding:0 11px; border-radius:999px; background:var(--primary-tint); color:var(--primary); font-weight:700; font-size:12.5px; }
.hs-steptrack { height:6px; border-radius:999px; background:var(--primary-tint); overflow:hidden; }
.hs-steptrack > i { display:block; height:100%; background:var(--primary); border-radius:999px; transition:width .3s ease; }

.hs-opt { display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px; color:var(--text); cursor:pointer; font:inherit; text-decoration:none; }
.hs-opt:hover { background:var(--surface-2); }
.hs-opt.is-on { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); background:var(--surface-2); }
.hs-opt .lead { width:42px; height:42px; min-width:42px; border-radius:12px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; --od-icon-size:21px; }

.hs-chip { display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:650; font-size:14px; cursor:pointer; }
.hs-chip.is-on { background:var(--primary-tint); border-color:var(--primary); color:var(--text); }
.hs-pill.accent { background:color-mix(in srgb,var(--accent) 20%, var(--surface)); color:var(--accent-ink); }
.phone-frame[data-theme="dark"] .hs-pill.accent { color:var(--accent); }

.hs-cmp { width:100%; border-collapse:collapse; font-size:13.5px; }
.hs-cmp th, .hs-cmp td { padding:10px 8px; border-bottom:1px solid var(--border); text-align:center; }
.hs-cmp th:first-child, .hs-cmp td:first-child { text-align:left; color:var(--muted); font-weight:600; }
.hs-cmp thead th { font-size:12.5px; font-weight:700; }
.hs-cmp .yes { color:var(--success); } .hs-cmp .no { color:var(--error); }
.hs-cmp .od-icon { --od-icon-size:17px; }

.hs-priceline { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
.hs-priceline.total { font-weight:750; border-bottom:none; font-size:15px; padding-top:12px; }
.hs-priceline.sub { color:var(--success); font-weight:650; }
.hs-priceline .amt { font-weight:700; white-space:nowrap; }

/* Dashboard (variant D) home */
.dash-top { background:var(--hero); color:var(--on-hero); padding:12px 18px 54px; border-radius:0 0 26px 26px; }
.dash-top .dim { color:var(--on-hero-dim); }
.dash-strip { display:flex; align-items:center; gap:12px; margin-top:16px; }
.dash-strip .amt { font-size:26px; font-weight:800; color:var(--accent); letter-spacing:-.01em; }
.dash-actions { margin:-38px 14px 0; position:relative; z-index:2; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:14px 8px; box-shadow:var(--shadow); display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
.dash-act { display:flex; flex-direction:column; align-items:center; gap:7px; padding:8px 4px; background:none; border:none; cursor:pointer; font:inherit; color:var(--text); text-decoration:none; }
.dash-act .ico { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; --od-icon-size:21px; }
.dash-act .ico.p { background:var(--primary-tint); color:var(--primary); }
.dash-act .ico.g { background:color-mix(in srgb,var(--accent) 20%, var(--surface)); color:var(--accent-ink); }
.phone-frame[data-theme="dark"] .dash-act .ico.g { color:var(--accent); }
.dash-act .lbl { font-size:11.5px; font-weight:650; }
.dash-act:hover .ico { filter:brightness(.97); }

/* ===================== Estimate: compact-dense shell + accordions + animated bg ===================== */
.est-app { position:relative; height:100%; display:flex; flex-direction:column; background:var(--bg); color:var(--text); overflow:hidden; }
.est-head { position:relative; z-index:2; flex:none; display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--bg); }
.est-head .title { font-size:18px; font-weight:750; }
.est-scroll { position:relative; z-index:1; flex:1; overflow-y:auto; min-height:0; scrollbar-width:none; }
.est-scroll::-webkit-scrollbar { display:none; }
.est-pad { padding:14px 16px 18px; display:flex; flex-direction:column; gap:12px; }
.est-price { font-size:27px; font-weight:800; color:var(--accent); letter-spacing:-.02em; line-height:1; }
.est-mini { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.est-mini .hs-stat { padding:9px; text-align:center; }
.est-mini .hs-stat .k { justify-content:center; }
.est-mini .hs-stat .v { font-size:15px; }
.est-bar { position:relative; z-index:2; flex:none; background:var(--surface); border-top:1px solid var(--border); padding:11px 14px calc(11px + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 24px -16px rgba(0,0,0,.4); display:flex; flex-direction:column; gap:9px; }
.est-bar .row { display:flex; gap:9px; align-items:stretch; }
.act { flex:1; min-height:48px; border-radius:13px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; --od-icon-size:19px; font:inherit; font-size:10.5px; font-weight:700; cursor:pointer; text-decoration:none; }
.act:hover { background:var(--bg-subtle); }
.v-dense { font-size:14px; }
.v-dense .est-pad { gap:9px; }
.v-dense .hs-sec-title { font-size:15px; }

.acc { border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden; }
.acc-h { width:100%; display:flex; align-items:center; gap:10px; padding:14px; background:none; border:none; font:inherit; font-weight:700; font-size:14.5px; color:var(--text); cursor:pointer; min-height:52px; }
.acc-h .ttl { flex:1; text-align:left; }
.acc-h .sumv { font-size:12.5px; color:var(--muted); font-weight:650; }
.acc-h .chev { --od-icon-size:18px; color:var(--muted); transition:transform .2s ease; display:inline-grid; }
.acc-h[aria-expanded="true"] .chev { transform:rotate(90deg); }
.acc-body { padding:0 14px 14px; }

/* Subtle animated ambient — drifting brand-coloured blobs behind the content */
.est-ambient { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.est-ambient .blob { position:absolute; border-radius:50%; filter:blur(36px); will-change:transform; }
.est-ambient .b1 { width:220px; height:220px; top:-50px; left:-60px; background:radial-gradient(circle, color-mix(in srgb,var(--primary) 34%, transparent), transparent 70%); animation:floatA 17s ease-in-out infinite; }
.est-ambient .b2 { width:240px; height:240px; bottom:120px; right:-70px; background:radial-gradient(circle, color-mix(in srgb,var(--accent) 22%, transparent), transparent 70%); animation:floatB 23s ease-in-out infinite; }
.est-ambient .b3 { width:180px; height:180px; top:44%; left:28%; background:radial-gradient(circle, color-mix(in srgb,var(--primary) 18%, transparent), transparent 70%); animation:floatA 29s ease-in-out infinite reverse; }
@keyframes floatA { 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(26px,22px); } }
@keyframes floatB { 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-30px,-18px); } }

/* Animated glow inside the summary hero */
.est-hero { position:relative; overflow:hidden; background:var(--hero); color:var(--on-hero); border-radius:18px; padding:16px; }
.est-hero > * { position:relative; z-index:1; }
.est-hero .hero-anim { position:absolute; inset:0; z-index:0; pointer-events:none; }
.est-hero .hero-anim .pulse { position:absolute; top:-52px; right:-34px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(247,168,27,.5), transparent 62%); animation:glowPulse 6s ease-in-out infinite; }
.est-hero .hero-anim .ray { position:absolute; top:-66px; right:-48px; width:210px; height:210px; opacity:.16; transform-origin:50% 50%; animation:spinSlow 36s linear infinite; }
.est-hero .hero-anim .ray line { stroke:var(--accent-soft); stroke-width:3; stroke-linecap:round; }
@keyframes glowPulse { 0%,100%{ opacity:.4; transform:scale(1); } 50%{ opacity:.72; transform:scale(1.08); } }
@keyframes spinSlow { to { transform:rotate(360deg); } }

/* ===================== Plan step pages (shared gradient background + pickers) ===================== */
.step-app { min-height:100%; display:flex; flex-direction:column; color:var(--text);
  background:linear-gradient(180deg, color-mix(in srgb, var(--primary) 16%, var(--bg)) 0%, color-mix(in srgb, var(--accent) 6%, var(--bg)) 34%, var(--bg) 70%); }
/* Solid, opaque sticky header + progress so scrolling content never bleeds through */
.step-app .hs-appbar { background:color-mix(in srgb, var(--primary) 16%, var(--bg)); }
.step-app .step-bar { background:transparent; }
.step-bar { padding:12px 16px 0; }
.step-title { font-size:20px; font-weight:750; letter-spacing:-.01em; margin:0; }
.pick { display:flex; flex-wrap:wrap; gap:8px; }
.map { height:120px; border-radius:16px; border:1.5px dashed var(--border); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted); }
.map svg { width:26px; height:26px; }
.cta { padding:16px; }

/* Entrance (reduced-motion safe) */
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.anim-rise { animation: rise .5s ease both; }
.anim-rise.d1 { animation-delay:.06s; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>

<div class="phone-frame" data-theme="light">

            <div class="od-cluster" style="--od-gap:7px; margin-top:12px;"><span class="hs-pill neutral">Fans</span><span class="hs-pill neutral">Lights</span><span class="hs-pill neutral">Wi-Fi &amp; TV</span><span class="hs-pill neutral">Fridge</span></div>

              <tr><td>Subsidy ₹78,000</td><td><i class="ic yes" data-ic="check"></i></td><td><i class="ic yes" data-ic="check"></i></td></tr>
              <tr><td>Price after subsidy</td><td><strong class="hs-rupee">₹1,20,000</strong></td><td class="hs-rupee">₹47,000</td></tr>

              <button type="button" class="hs-chip od-fill" style="justify-content:space-between;"><span>Waaree</span><span class="hs-pill accent">+₹12,000</span></button>
            </div>
          </div>
        </div>

        <div class="cta"><a class="hs-btn hs-btn-primary" href="estimate.html">See my quote</a></div>
      </div>

    </main>

  };

  function iconSVG(name){
    return '<svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  function replaceIcons(root){
    var marks = root.querySelectorAll('[data-ic]');
    for (var i = 0; i < marks.length; i++){
      var el = marks[i];
      var wrap = document.createElement('span');
      wrap.innerHTML = iconSVG(el.getAttribute('data-ic'));
      var svg = wrap.firstChild;
      var extra = el.className.replace(/\bic\b/, '').trim();
      if (extra) svg.setAttribute('class', svg.getAttribute('class') + ' ' + extra);
      if (el.getAttribute('style')) svg.setAttribute('style', el.getAttribute('style'));
      el.parentNode.replaceChild(svg, el);
    }
  }

  function setThemeIcon(btn, theme){
    btn.innerHTML = iconSVG(theme === 'dark' ? 'sun' : 'moon');

  }

  function initTheme(){
    var frame = document.querySelector('.phone-frame');

    for (var i = 0; i < toggles.length; i++) setThemeIcon(toggles[i], frame.getAttribute('data-theme'));
  }

  document.addEventListener('DOMContentLoaded', function () {
    replaceIcons(document);
    initTheme();

    document.addEventListener('click', function (e){
      var t = e.target;
      if (!t.closest) return;

      // Accordion
      var acc = t.closest('.acc-h');

        var accOpen = acc.getAttribute('aria-expanded') === 'true';

      var pchip = t.closest('.pick[data-group] .hs-chip');
      if (pchip){
        var pgrp = pchip.closest('.pick');
        var pchips = pgrp.querySelectorAll('.hs-chip');
        for (var pi = 0; pi < pchips.length; pi++) pchips[pi].classList.remove('is-on');
        pchip.classList.add('is-on');
        return;
      }

      // Copy to clipboard (referral code, etc.)
      var cp = t.closest('[data-copy]');
      if (cp){
        var val = cp.getAttribute('data-copy');
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val); } catch (err) {}
        var lbl = cp.querySelector('[data-copy-label]');
        if (lbl){
          if (!lbl.getAttribute('data-prev')) lbl.setAttribute('data-prev', lbl.textContent);
          lbl.textContent = 'Copied ✓';
          setTimeout(function (){ lbl.textContent = lbl.getAttribute('data-prev'); }, 1600);
        }
        return;
      }

      // Theme toggle
      var themeBtn = t.closest('[data-theme-toggle]');
      if (themeBtn){
        var frame = document.querySelector('.phone-frame');
        var next = frame.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        frame.setAttribute('data-theme', next);
        var toggles = document.querySelectorAll('[data-theme-toggle]');
        for (var i = 0; i < toggles.length; i++) setThemeIcon(toggles[i], next);
        return;
      }

      // Language cards (login)
      var card = t.closest('.lang-card');
      if (card){
        var grid = card.closest('.lang-grid');
        if (grid){
          var cards = grid.querySelectorAll('.lang-card');
          for (var c = 0; c < cards.length; c++){ cards[c].classList.remove('is-on'); cards[c].removeAttribute('aria-pressed'); }
          card.classList.add('is-on'); card.setAttribute('aria-pressed','true');
        }

      }

      // Language toggle (home app bar) — swaps the hero headline EN/HI
      var lang = t.closest('[data-lang]');
      if (lang){
        var grp = lang.closest('.hs-langtoggle');
        if (grp){
          var ls = grp.querySelectorAll('[data-lang]');
          for (var l = 0; l < ls.length; l++) ls[l].classList.remove('is-on');
          lang.classList.add('is-on');
        }
        var code = lang.getAttribute('data-lang');
        var title = document.querySelector('[data-en][data-hi]');
        if (title){
          var next2 = title.getAttribute(code === 'hi' ? 'data-hi' : 'data-en');
          if (next2){ title.textContent = next2; title.setAttribute('lang', code === 'hi' ? 'hi' : 'en'); }
        }
        return;
      }

      // Hero bill chips (single select)
      var hchip = t.closest('.hs-hchip');
      if (hchip){
        var row = hchip.parentNode;
        var sibs = row.querySelectorAll('.hs-hchip');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('is-on');
        hchip.classList.add('is-on');
      }
    });
  });
})();

.hs-btn-gold { background:var(--accent); color:var(--accent-ink); }

.hs-btn-ghost { background:var(--surface); color:var(--text); border:1px solid var(--border); }
.hs-btn-ghost:hover { background:var(--surface-2); }
.hs-btn-sm { min-height:46px; font-size:14px; border-radius:13px; }
.hs-link { color:var(--primary); font-weight:700; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; gap:5px; --od-icon-size:16px; background:none; border:none; cursor:pointer; padding:0; font-family:inherit; }
.hs-link:hover { text-decoration:underline; }

/* Cards */
.hs-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow:var(--shadow-sm); }
.hs-card.flat { box-shadow:none; }

/* Hero */
.hs-hero { background:var(--hero); color:var(--on-hero); border-radius:20px; padding:18px; }
.hs-hero .dim { color:var(--on-hero-dim); }
.hs-hero-title { font-size:22px; font-weight:750; letter-spacing:-.01em; line-height:1.2; }

/* Pills / chips */
.hs-pill { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:11.5px; font-weight:700; --od-icon-size:14px; }

.hs-pill.primary { background:var(--primary-tint); color:var(--primary); }
.hs-pill.neutral { background:var(--surface-2); color:var(--muted); }
.hs-pill.onhero { background:rgba(255,255,255,.14); color:var(--on-hero); }
.hs-hchip { display:inline-flex; align-items:center; min-height:38px; padding:0 14px; border-radius:999px; background:rgba(255,255,255,.12); color:var(--on-hero); font-weight:650; font-size:14px; cursor:pointer; border:1px solid transparent; }
.hs-hchip.is-on { background:#fff; color:var(--hero); }

/* Stats */
.hs-stat { padding:13px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border); }
.hs-stat .k { font-size:12px; color:var(--muted); font-weight:600; display:inline-flex; align-items:center; gap:6px; --od-icon-size:15px; }
.hs-stat .v { font-size:18px; font-weight:750; letter-spacing:-.01em; margin-top:4px; }
.hs-stat .v small { font-size:12px; font-weight:600; color:var(--muted); }

/* Language toggle (home app bar) */
.hs-langtoggle { display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
.hs-lang-opt { min-width:40px; min-height:36px; padding:0 11px; border:none; background:transparent; color:var(--muted); font:inherit; font-weight:700; font-size:13px; border-radius:999px; cursor:pointer; }
.hs-lang-opt.is-on { background:var(--primary); color:var(--on-primary); }

/* Alert (cream) */
.hs-alert { background:color-mix(in srgb, var(--accent) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--accent) 34%, transparent); border-radius:16px; padding:15px; }
.hs-alert .hd { display:flex; align-items:center; gap:8px; color:var(--accent-ink); font-weight:750; font-size:13px; --od-icon-size:18px; }
.phone-frame[data-theme="dark"] .hs-alert .hd { color:var(--accent); }

/* Timeline */
.hs-timeline { list-style:none; margin:0; padding:0; }
.hs-timeline li { position:relative; display:grid; grid-template-columns:28px 1fr; gap:12px; padding-bottom:16px; }
.hs-timeline li:last-child { padding-bottom:0; }
.hs-dot { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; --od-icon-size:15px; z-index:1; }
.hs-dot.done { background:var(--success); color:#fff; }
.hs-dot.todo { background:var(--surface); border:1.5px solid var(--border); color:var(--muted); }
.hs-timeline li:not(:last-child) .hs-dot::after { content:""; position:absolute; top:28px; left:12px; bottom:2px; width:2px; background:var(--border); }
.hs-tl-title { font-weight:650; font-size:14px; }
.hs-tl-meta { font-size:12.5px; color:var(--muted); }

/* Video row */
.hs-video { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:11px; color:var(--text); cursor:pointer; font:inherit; text-decoration:none; }
.hs-video:hover { background:var(--surface-2); }
.hs-video .play { width:44px; height:44px; min-width:44px; border-radius:11px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; --od-icon-size:18px; }

/* Avatar */
.hs-avatar { width:52px; height:52px; min-width:52px; border-radius:50%; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; font-weight:750; font-size:20px; }
.hs-avatar.sm { width:38px; height:38px; min-width:38px; font-size:14px; --od-icon-size:18px; }
.hs-avatar.gold { background:var(--accent); color:var(--accent-ink); }

/* Bottom nav */
.hs-nav { position:sticky; bottom:0; z-index:6; display:flex; background:var(--surface); border-top:1px solid var(--border); padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px)); }
.hs-nav-item { flex:1; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; min-height:50px; color:var(--muted); font:inherit; --od-icon-size:23px; border-radius:12px; text-decoration:none; }
.hs-nav-item .lbl { font-size:11px; font-weight:650; }
.hs-nav-item[aria-current="page"] { color:var(--primary); }
.hs-nav-item:hover { background:var(--surface-2); }

/* ===================== Login page ===================== */
.login-hero {
  position:relative; overflow:hidden; color:var(--on-hero);
  background:
    radial-gradient(130% 90% at 82% -4%, var(--hero-2) 0%, transparent 52%),
    radial-gradient(120% 80% at 8% 2%, rgba(247,168,27,.16) 0%, transparent 46%),
    var(--hero);
  padding: 2px 22px 50px; border-radius:0 0 34px 34px;
}
.login-sun { position:absolute; top:-26px; right:-26px; width:188px; height:188px; opacity:.5; pointer-events:none; }
.login-hero-inner { position:relative; z-index:1; }
.login-topbar { display:flex; align-items:center; justify-content:flex-end; padding-top:6px; }
.brand-lockup { display:flex; align-items:center; gap:12px; margin-top:4px; }
.brand-mark { width:46px; height:46px; min-width:46px; border-radius:14px; display:grid; place-items:center; color:var(--accent-ink); background:linear-gradient(150deg, var(--accent-soft), var(--accent)); box-shadow:0 8px 20px -8px rgba(247,168,27,.7); }
.brand-mark svg { width:26px; height:26px; }
.brand-name { font-size:17px; font-weight:800; letter-spacing:.01em; line-height:1; display:block; }
.brand-tag { font-size:11px; font-weight:650; letter-spacing:.22em; text-transform:uppercase; color:var(--on-hero-dim); margin-top:5px; }
.hero-headline { font-size:27px; font-weight:750; letter-spacing:-.01em; line-height:1.22; margin:24px 0 0; }
.hero-sub { color:var(--on-hero-dim); font-size:14px; line-height:1.55; margin:12px 0 0; max-width:300px; }
.trust-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
.trust-chip { display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); font-size:12px; font-weight:650; }
.trust-chip svg { width:15px; height:15px; flex:none; }
.trust-chip.gold { background:rgba(247,168,27,.16); border-color:rgba(247,168,27,.34); color:var(--accent-soft); }
.theme-toggle { width:40px; height:40px; min-width:40px; display:grid; place-items:center; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:var(--on-hero); cursor:pointer; --od-icon-size:19px; }
.theme-toggle:hover { background:rgba(255,255,255,.18); }
.hs-appbar .theme-toggle { border-color:var(--border); background:var(--surface); color:var(--text); }
.hs-appbar .theme-toggle:hover { background:var(--surface-2); }

.login-sheet { position:relative; z-index:2; margin:-22px 16px 0; background:var(--surface); border:1px solid var(--border); border-radius:26px; padding:22px 18px; box-shadow:var(--shadow); }
.field-label { font-size:13px; font-weight:700; color:var(--text); display:block; margin-bottom:9px; }
.field-label .hindi { color:var(--muted); font-weight:600; }
.lang-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.lang-card { position:relative; display:flex; flex-direction:column; gap:3px; align-items:flex-start; padding:13px 14px; border-radius:16px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; font:inherit; text-align:left; min-height:72px; }
.lang-card .script { font-size:22px; font-weight:700; line-height:1; }
.lang-card .name { font-size:12.5px; color:var(--muted); font-weight:600; }
.lang-card.is-on { border-color:var(--primary); background:var(--primary-tint); box-shadow:0 0 0 1px var(--primary); }
.lang-card.is-on .name { color:var(--primary); }
.lang-card .tick { position:absolute; top:10px; right:10px; width:20px; height:20px; border-radius:50%; background:var(--primary); color:var(--on-primary); display:none; place-items:center; }
.lang-card .tick svg { width:13px; height:13px; }
.lang-card.is-on .tick { display:grid; }
.phone-grp { display:flex; gap:9px; }
.phone-cc { min-width:62px; display:inline-flex; align-items:center; justify-content:center; border-radius:14px; border:1.5px solid var(--border); background:var(--surface-2); font-weight:700; font-size:14.5px; }
.hs-input { width:100%; min-height:52px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); padding:0 15px; font:inherit; font-size:16px; }
.hs-input::placeholder { color:var(--muted); }
.hs-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint); }
.consent { display:flex; align-items:center; gap:11px; margin-top:16px; padding:12px 13px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border); cursor:pointer; }
.consent input { position:absolute; opacity:0; width:0; height:0; }
.consent .box { width:24px; height:24px; min-width:24px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); display:grid; place-items:center; color:transparent; }
.consent .box svg { width:15px; height:15px; }
.consent input:checked + .box { background:var(--success); border-color:var(--success); color:#fff; }
.consent .wa { width:30px; height:30px; min-width:30px; border-radius:9px; background:var(--success-tint); color:var(--success); display:grid; place-items:center; }
.consent .wa svg { width:17px; height:17px; }
.consent .txt { font-size:13px; font-weight:600; line-height:1.4; }
.secure { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:14px; color:var(--muted); font-size:12px; font-weight:600; }
.secure svg { width:14px; height:14px; }
.login-foot { padding:20px 20px 10px; }
.returning { display:flex; align-items:center; gap:11px; padding:13px 14px; border-radius:16px; background:var(--surface-2); border:1px dashed var(--border); }
.returning .ic { width:34px; height:34px; min-width:34px; border-radius:10px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; }
.returning .ic svg { width:18px; height:18px; }
.returning .t { font-size:12.5px; font-weight:650; }
.returning .d { font-size:11.5px; color:var(--muted); line-height:1.4; }
.terms { text-align:center; font-size:11.5px; color:var(--muted); margin:16px 0 0; line-height:1.5; }
.terms a { color:var(--primary); text-decoration:none; font-weight:650; }

/* ===================== Flow pages (bill / estimate / dashboard home) ===================== */
.hs-backbtn { width:42px; height:42px; min-width:42px; display:grid; place-items:center; border-radius:12px; border:none; background:transparent; color:var(--text); cursor:pointer; --od-icon-size:22px; text-decoration:none; }
.hs-backbtn:hover { background:var(--surface-2); }
.hs-stepchip { display:inline-flex; align-items:center; min-height:30px; padding:0 11px; border-radius:999px; background:var(--primary-tint); color:var(--primary); font-weight:700; font-size:12.5px; }
.hs-steptrack { height:6px; border-radius:999px; background:var(--primary-tint); overflow:hidden; }
.hs-steptrack > i { display:block; height:100%; background:var(--primary); border-radius:999px; transition:width .3s ease; }

.hs-opt { display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px; color:var(--text); cursor:pointer; font:inherit; text-decoration:none; }
.hs-opt:hover { background:var(--surface-2); }
.hs-opt.is-on { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); background:var(--surface-2); }
.hs-opt .lead { width:42px; height:42px; min-width:42px; border-radius:12px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; --od-icon-size:21px; }

.hs-chip { display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:650; font-size:14px; cursor:pointer; }
.hs-chip.is-on { background:var(--primary-tint); border-color:var(--primary); color:var(--text); }
.hs-pill.accent { background:color-mix(in srgb,var(--accent) 20%, var(--surface)); color:var(--accent-ink); }
.phone-frame[data-theme="dark"] .hs-pill.accent { color:var(--accent); }

.hs-cmp { width:100%; border-collapse:collapse; font-size:13.5px; }
.hs-cmp th, .hs-cmp td { padding:10px 8px; border-bottom:1px solid var(--border); text-align:center; }
.hs-cmp th:first-child, .hs-cmp td:first-child { text-align:left; color:var(--muted); font-weight:600; }
.hs-cmp thead th { font-size:12.5px; font-weight:700; }
.hs-cmp .yes { color:var(--success); } .hs-cmp .no { color:var(--error); }
.hs-cmp .od-icon { --od-icon-size:17px; }

.hs-priceline { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
.hs-priceline.total { font-weight:750; border-bottom:none; font-size:15px; padding-top:12px; }
.hs-priceline.sub { color:var(--success); font-weight:650; }
.hs-priceline .amt { font-weight:700; white-space:nowrap; }

/* Dashboard (variant D) home */
.dash-top { background:var(--hero); color:var(--on-hero); padding:12px 18px 54px; border-radius:0 0 26px 26px; }
.dash-top .dim { color:var(--on-hero-dim); }
.dash-strip { display:flex; align-items:center; gap:12px; margin-top:16px; }
.dash-strip .amt { font-size:26px; font-weight:800; color:var(--accent); letter-spacing:-.01em; }
.dash-actions { margin:-38px 14px 0; position:relative; z-index:2; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:14px 8px; box-shadow:var(--shadow); display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
.dash-act { display:flex; flex-direction:column; align-items:center; gap:7px; padding:8px 4px; background:none; border:none; cursor:pointer; font:inherit; color:var(--text); text-decoration:none; }
.dash-act .ico { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; --od-icon-size:21px; }
.dash-act .ico.p { background:var(--primary-tint); color:var(--primary); }
.dash-act .ico.g { background:color-mix(in srgb,var(--accent) 20%, var(--surface)); color:var(--accent-ink); }
.phone-frame[data-theme="dark"] .dash-act .ico.g { color:var(--accent); }
.dash-act .lbl { font-size:11.5px; font-weight:650; }
.dash-act:hover .ico { filter:brightness(.97); }

/* ===================== Estimate: compact-dense shell + accordions + animated bg ===================== */
.est-app { position:relative; height:100%; display:flex; flex-direction:column; background:var(--bg); color:var(--text); overflow:hidden; }
.est-head { position:relative; z-index:2; flex:none; display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--bg); }
.est-head .title { font-size:18px; font-weight:750; }
.est-scroll { position:relative; z-index:1; flex:1; overflow-y:auto; min-height:0; scrollbar-width:none; }
.est-scroll::-webkit-scrollbar { display:none; }
.est-pad { padding:14px 16px 18px; display:flex; flex-direction:column; gap:12px; }
.est-price { font-size:27px; font-weight:800; color:var(--accent); letter-spacing:-.02em; line-height:1; }
.est-mini { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.est-mini .hs-stat { padding:9px; text-align:center; }
.est-mini .hs-stat .k { justify-content:center; }
.est-mini .hs-stat .v { font-size:15px; }
.est-bar { position:relative; z-index:2; flex:none; background:var(--surface); border-top:1px solid var(--border); padding:11px 14px calc(11px + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 24px -16px rgba(0,0,0,.4); display:flex; flex-direction:column; gap:9px; }
.est-bar .row { display:flex; gap:9px; align-items:stretch; }
.act { flex:1; min-height:48px; border-radius:13px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; --od-icon-size:19px; font:inherit; font-size:10.5px; font-weight:700; cursor:pointer; text-decoration:none; }
.act:hover { background:var(--bg-subtle); }
.v-dense { font-size:14px; }
.v-dense .est-pad { gap:9px; }
.v-dense .hs-sec-title { font-size:15px; }

.acc { border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden; }
.acc-h { width:100%; display:flex; align-items:center; gap:10px; padding:14px; background:none; border:none; font:inherit; font-weight:700; font-size:14.5px; color:var(--text); cursor:pointer; min-height:52px; }
.acc-h .ttl { flex:1; text-align:left; }
.acc-h .sumv { font-size:12.5px; color:var(--muted); font-weight:650; }
.acc-h .chev { --od-icon-size:18px; color:var(--muted); transition:transform .2s ease; display:inline-grid; }
.acc-h[aria-expanded="true"] .chev { transform:rotate(90deg); }
.acc-body { padding:0 14px 14px; }

/* Subtle animated ambient — drifting brand-coloured blobs behind the content */
.est-ambient { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.est-ambient .blob { position:absolute; border-radius:50%; filter:blur(36px); will-change:transform; }
.est-ambient .b1 { width:220px; height:220px; top:-50px; left:-60px; background:radial-gradient(circle, color-mix(in srgb,var(--primary) 34%, transparent), transparent 70%); animation:floatA 17s ease-in-out infinite; }
.est-ambient .b2 { width:240px; height:240px; bottom:120px; right:-70px; background:radial-gradient(circle, color-mix(in srgb,var(--accent) 22%, transparent), transparent 70%); animation:floatB 23s ease-in-out infinite; }
.est-ambient .b3 { width:180px; height:180px; top:44%; left:28%; background:radial-gradient(circle, color-mix(in srgb,var(--primary) 18%, transparent), transparent 70%); animation:floatA 29s ease-in-out infinite reverse; }
@keyframes floatA { 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(26px,22px); } }
@keyframes floatB { 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-30px,-18px); } }

/* Animated glow inside the summary hero */
.est-hero { position:relative; overflow:hidden; background:var(--hero); color:var(--on-hero); border-radius:18px; padding:16px; }
.est-hero > * { position:relative; z-index:1; }
.est-hero .hero-anim { position:absolute; inset:0; z-index:0; pointer-events:none; }
.est-hero .hero-anim .pulse { position:absolute; top:-52px; right:-34px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(247,168,27,.5), transparent 62%); animation:glowPulse 6s ease-in-out infinite; }
.est-hero .hero-anim .ray { position:absolute; top:-66px; right:-48px; width:210px; height:210px; opacity:.16; transform-origin:50% 50%; animation:spinSlow 36s linear infinite; }
.est-hero .hero-anim .ray line { stroke:var(--accent-soft); stroke-width:3; stroke-linecap:round; }
@keyframes glowPulse { 0%,100%{ opacity:.4; transform:scale(1); } 50%{ opacity:.72; transform:scale(1.08); } }
@keyframes spinSlow { to { transform:rotate(360deg); } }

/* ===================== Plan step pages (shared gradient background + pickers) ===================== */
.step-app { min-height:100%; display:flex; flex-direction:column; color:var(--text);
  background:linear-gradient(180deg, color-mix(in srgb, var(--primary) 16%, var(--bg)) 0%, color-mix(in srgb, var(--accent) 6%, var(--bg)) 34%, var(--bg) 70%); }
/* Solid, opaque sticky header + progress so scrolling content never bleeds through */
.step-app .hs-appbar { background:color-mix(in srgb, var(--primary) 16%, var(--bg)); }
.step-app .step-bar { background:transparent; }
.step-bar { padding:12px 16px 0; }
.step-title { font-size:20px; font-weight:750; letter-spacing:-.01em; margin:0; }
.pick { display:flex; flex-wrap:wrap; gap:8px; }
.map { height:120px; border-radius:16px; border:1.5px dashed var(--border); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted); }
.map svg { width:26px; height:26px; }
.cta { padding:16px; }

/* Entrance (reduced-motion safe) */
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.anim-rise { animation: rise .5s ease both; }
.anim-rise.d1 { animation-delay:.06s; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

<body>
<div class="phone-frame" data-theme="light">
  <span class="hardware-button volume" aria-hidden="true"></span>
  <span class="hardware-button power" aria-hidden="true"></span>

(function () {

  var ICONS = {

    chat:'<path d="M4 19l1.4-3.4A7.5 7.5 0 1 1 9 18.6 7.6 7.6 0 0 1 4 19Z"/>',
    sun:'<circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M6 6 4.6 4.6M19.4 19.4 18 18M18 6l1.4-1.4M4.6 19.4 6 18"/>',
    moon:'<path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10Z"/>',

    alert:'<path d="M12 4 2.8 20h18.4z"/><path d="M12 10v4M12 17h.01"/>',
    play:'<path d="M8 5v14l11-7z"/>',
    camera:'<path d="M4 8h3l1.5-2h7L17 8h3v10H4Z"/><path d="M12 11a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>',
    battery:'<rect x="3" y="8" width="15" height="9" rx="2.5"/><path d="M21 11v3"/>',
    arrow:'<path d="M5 12h14m-5-6 6 6-6 6"/>',
    lock:'<rect x="6" y="11" width="12" height="9" rx="2"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/>',
    upload:'<path d="M12 16V5m0 0 4 4m-4-4-4 4M5 19h14"/>',

  };

  function iconSVG(name){
    return '<svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  function replaceIcons(root){
    var marks = root.querySelectorAll('[data-ic]');
    for (var i = 0; i < marks.length; i++){
      var el = marks[i];
      var wrap = document.createElement('span');
      wrap.innerHTML = iconSVG(el.getAttribute('data-ic'));
      var svg = wrap.firstChild;
      var extra = el.className.replace(/\bic\b/, '').trim();
      if (extra) svg.setAttribute('class', svg.getAttribute('class') + ' ' + extra);
      if (el.getAttribute('style')) svg.setAttribute('style', el.getAttribute('style'));
      el.parentNode.replaceChild(svg, el);
    }
  }

  function setThemeIcon(btn, theme){
    btn.innerHTML = iconSVG(theme === 'dark' ? 'sun' : 'moon');
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }

  function initTheme(){
    var frame = document.querySelector('.phone-frame');
    if (!frame) return;
    if (!frame.getAttribute('data-theme')){
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      frame.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    }
    var toggles = document.querySelectorAll('[data-theme-toggle]');
    for (var i = 0; i < toggles.length; i++) setThemeIcon(toggles[i], frame.getAttribute('data-theme'));
  }

  document.addEventListener('DOMContentLoaded', function () {
    replaceIcons(document);
    initTheme();

    document.addEventListener('click', function (e){
      var t = e.target;
      if (!t.closest) return;

      // Accordion
      var acc = t.closest('.acc-h');
      if (acc){
        var accOpen = acc.getAttribute('aria-expanded') === 'true';
        acc.setAttribute('aria-expanded', String(!accOpen));
        var accBody = acc.parentNode.querySelector('.acc-body');
        if (accBody) accBody.hidden = accOpen;
        return;
      }

      // Single-select chip group (plan steps)
      var pchip = t.closest('.pick[data-group] .hs-chip');
      if (pchip){
        var pgrp = pchip.closest('.pick');
        var pchips = pgrp.querySelectorAll('.hs-chip');
        for (var pi = 0; pi < pchips.length; pi++) pchips[pi].classList.remove('is-on');
        pchip.classList.add('is-on');
        return;
      }

      // Copy to clipboard (referral code, etc.)
      var cp = t.closest('[data-copy]');
      if (cp){
        var val = cp.getAttribute('data-copy');
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val); } catch (err) {}
        var lbl = cp.querySelector('[data-copy-label]');
        if (lbl){
          if (!lbl.getAttribute('data-prev')) lbl.setAttribute('data-prev', lbl.textContent);
          lbl.textContent = 'Copied ✓';
          setTimeout(function (){ lbl.textContent = lbl.getAttribute('data-prev'); }, 1600);
        }
        return;
      }

      // Theme toggle
      var themeBtn = t.closest('[data-theme-toggle]');
      if (themeBtn){
        var frame = document.querySelector('.phone-frame');
        var next = frame.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        frame.setAttribute('data-theme', next);
        var toggles = document.querySelectorAll('[data-theme-toggle]');
        for (var i = 0; i < toggles.length; i++) setThemeIcon(toggles[i], next);
        return;
      }

      // Language cards (login)
      var card = t.closest('.lang-card');
      if (card){
        var grid = card.closest('.lang-grid');
        if (grid){
          var cards = grid.querySelectorAll('.lang-card');
          for (var c = 0; c < cards.length; c++){ cards[c].classList.remove('is-on'); cards[c].removeAttribute('aria-pressed'); }
          card.classList.add('is-on'); card.setAttribute('aria-pressed','true');
        }
        return;
      }

      // Language toggle (home app bar) — swaps the hero headline EN/HI
      var lang = t.closest('[data-lang]');
      if (lang){
        var grp = lang.closest('.hs-langtoggle');
        if (grp){
          var ls = grp.querySelectorAll('[data-lang]');
          for (var l = 0; l < ls.length; l++) ls[l].classList.remove('is-on');
          lang.classList.add('is-on');
        }
        var code = lang.getAttribute('data-lang');
        var title = document.querySelector('[data-en][data-hi]');
        if (title){
          var next2 = title.getAttribute(code === 'hi' ? 'data-hi' : 'data-en');
          if (next2){ title.textContent = next2; title.setAttribute('lang', code === 'hi' ? 'hi' : 'en'); }
        }
        return;
      }

      // Hero bill chips (single select)
      var hchip = t.closest('.hs-hchip');
      if (hchip){
        var row = hchip.parentNode;
        var sibs = row.querySelectorAll('.hs-hchip');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('is-on');
        hchip.classList.add('is-on');
      }
    });
  });
})();
